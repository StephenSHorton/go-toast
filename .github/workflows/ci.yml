name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: go test (windows/386)
        if: runner.os == 'Windows'
        shell: bash
        run: GOARCH=386 go test ./...
      - name: smoke test (real cards on the runner's desktop)
        if: runner.os == 'macOS'
        env:
          GO_TOAST_SMOKE: "1"
        run: |
          go test -v -count=1 -run Smoke .
          GO_TOAST_RADIUS=10 go test -v -count=1 -run Smoke .

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux go build ./...
      - name: no-cgo macOS build falls back to the no-op backend
        run: GOOS=darwin CGO_ENABLED=0 go build ./...
      - run: GOOS=windows go build ./...
